<script>
  let pollTimer = null;
  let countdownTimer = null;
  let remainingSeconds = 150;

  function wakeNAS() {
    const pin = document.getElementById("pin").value;
    const button = document.getElementById("wake");
    const status = document.getElementById("status");
    const timerEl = document.getElementById("timer");

    if (!pin) {
      status.textContent = "Vui lòng nhập PIN.";
      return;
    }

    button.disabled = true;
    status.style.color = "#64748b";
    status.textContent = "Đang gửi yêu cầu...";
    timerEl.textContent = "";

    google.script.run
      .withSuccessHandler(function(result) {
        status.textContent = result.message;

        if (result.ok) {
          startCountdown(150);
          startTracking();
        } else {
          button.disabled = false;
        }
      })
      .withFailureHandler(function(error) {
        status.textContent = "Lỗi: " + error.message;
        button.disabled = false;
      })
      .requestWake(pin);
  }

  function startCountdown(seconds) {
    if (countdownTimer) clearInterval(countdownTimer);
    remainingSeconds = seconds;

    countdownTimer = setInterval(function() {
      const timerEl = document.getElementById("timer");
      if (remainingSeconds > 0) {
        const min = Math.floor(remainingSeconds / 60);
        const sec = remainingSeconds % 60;
        const secStr = sec < 10 ? "0" + sec : sec;
        timerEl.textContent = "Thời gian chờ còn lại: " + min + ":" + secStr;
        remainingSeconds--;
      } else {
        timerEl.textContent = "Đang kiểm tra kết quả Ping...";
      }
    }, 1000);
  }

  function startTracking() {
    if (pollTimer) clearInterval(pollTimer);

    pollTimer = setInterval(function() {
      google.script.run
        .withSuccessHandler(function(res) {
          if (!res || !res.ok) return;

          const statusEl = document.getElementById("status");
          const button = document.getElementById("wake");
          const timerEl = document.getElementById("timer");

          if (res.status === "WAITING_ESP") {
            statusEl.style.color = "#64748b";
            statusEl.textContent = "Đang chờ ESP8266 nhận lệnh...";
          } 
          else if (res.status === "BOOTING") {
            statusEl.style.color = "#d97706";
            statusEl.textContent = "ESP đã phát Magic Packet! Đang chờ NAS khởi động...";
          } 
          else if (res.status === "ONLINE") {
            statusEl.style.color = "#16a34a";
            statusEl.textContent = "🟢 THÀNH CÔNG: NAS đã bật và hoạt động (Ping OK)!";
            button.disabled = false;
            timerEl.textContent = "";
            clearInterval(pollTimer);
            if (countdownTimer) clearInterval(countdownTimer);
          } 
          else if (res.status === "FAILED") {
            statusEl.style.color = "#dc2626";
            statusEl.textContent = "🔴 THẤT BẠI: Đã phát gói tin nhưng NAS không phản hồi Ping.";
            button.disabled = false;
            timerEl.textContent = "";
            clearInterval(pollTimer);
            if (countdownTimer) clearInterval(countdownTimer);
          }
        })
        .withFailureHandler(function(err) {
          console.error("Lỗi poll status:", err);
        })
        .getSystemStatus();
    }, 2000);
  }
</script>
