<script>
let CountDownTimer = null;
let RemainingTime = 0;
let TrackingInterval = null;
let WaitingESPSince = 0;
const ESP_TIMEOUT_MS = 30000;

function WakeNAS() {
  console.log("1. Hàm WakeNAS() bắt đầu chạy");
  const Pin = document.getElementById("PIN").value;
  const Button = document.getElementById("WAKE");
  const Status = document.getElementById("STATUS");
  const TimerEL = document.getElementById("TIMER");

  Button.disabled = true;
  Status.style.color = "#64748b";
  Status.textContent = "Đang gửi yêu cầu...";
  TimerEL.textContent = "";

  console.log("7. Đã cập nhật giao diện");

  console.log("8. Bắt đầu gọi requestWake()");
  google.script.run
    .withSuccessHandler(function(Result) {
      console.log("9. Máy chủ trả kết quả:", Result);
      Status.textContent = Result.MESSAGE;
      if (Result.STATUS) {
        StartTracking();
      } else {
        Button.disabled = false;
      }
    })
    .withFailureHandler(function(Error) {
      console.error("Lỗi khi gửi yêu cầu:", Error);
      Status.textContent = "Lỗi: " + Error.message;
      Button.disabled = false;
    })
    .RequestWake(Pin);
}

function StartCountDown(Seconds) {
  if (CountDownTimer) clearInterval(CountDownTimer);
  RemainingTime = Seconds;
  CountDownTimer = setInterval(function() {
    const TimerEL = document.getElementById("TIMER");
    if (RemainingTime > 0) {
      const min = Math.floor(RemainingTime / 60);
      const sec = RemainingTime % 60;
      const secStr = sec < 10 ? "0" + sec : sec;
      TimerEL.textContent = "Thời gian chờ còn lại: " + min + ":" + secStr;
      RemainingTime--;
    } else {
      TimerEL.textContent = "Đang kiểm tra kết quả Ping...";
      clearInterval(CountDownTimer);
    }
  }, 1000);
}

function StartTracking() {
  if (TrackingInterval) clearInterval(TrackingInterval);
  let IsCountDownStarted = false;
  WaitingEspSince = Date.now();

  TrackingInterval = setInterval(function() {
    google.script.run
      .withSuccessHandler(function(Response) {
        if (!Response) return;
        const StatusEL = document.getElementById("STATUS");
        const Button   = document.getElementById("WAKE");
        const TimerEL  = document.getElementById("TIMER");

        if (Response.STATUS === "WAITING_ESP") {
          StatusEL.style.color = "#64748b";
          StatusEL.textContent = "Đang chờ ESP nhận lệnh...";
          if (Date.now() - WaitingEspSince > ESP_TIMEOUT_MS) {
            StatusEL.style.color = "#dc2626";
            StatusEL.textContent = "🔴 ESP không phản hồi. Kiểm tra nguồn/WiFi của ESP.";
            Button.disabled = false;
            if (TimerEL) TimerEL.textContent = "";
            StopAllTimers();
          }
        } else if (Response.STATUS === "BOOTING" || Response.STATUS === "WOL_SENT") {
          StatusEL.style.color = "#d97706";
          StatusEL.textContent = "ESP đã gửi gói WOL! Đang chờ NAS khởi động...";
          if (!IsCountDownStarted) {
            IsCountDownStarted = true;
            const WaitTimeSec = Number(Response.WAIT_TIME) || 150;
            StartCountDown(WaitTimeSec);
          }
        } else if (Response.STATUS === "ONLINE") {
          StatusEL.style.color = "#16a34a";
          StatusEL.textContent = "🟢 THÀNH CÔNG: NAS đã bật và hoạt động!";
          Button.disabled = false;
          if (TimerEL) TimerEL.textContent = "";
          StopAllTimers();
        } else if (Response.STATUS === "FAILED") {
          StatusEL.style.color = "#dc2626";
          StatusEL.textContent = "🔴 THẤT BẠI: Đã gửi gói tin nhưng NAS không phản hồi Ping.";
          Button.disabled = false;
          if (TimerEL) TimerEL.textContent = "";
          StopAllTimers();
        }
      })
      .withFailureHandler(function(Error) {
        console.error("Lỗi khi kiểm tra trạng thái:", Error);
        const StatusEL = document.getElementById("STATUS");
        StatusEL.style.color = "#dc2626";
        StatusEL.textContent = "Lỗi kết nối.";
        Button.disabled = false;
        StopAllTimers();
      })
      .GetStatus();
  }, 2000);
}

function StopAllTimers() {
  if (TrackingInterval) {
    clearInterval(TrackingInterval);
    TrackingInterval = null;
  }
  if (CountDownTimer) {
    clearInterval(CountDownTimer);
    CountDownTimer = null;
  }
}

function ToggleSettings() {
  const MainView = document.getElementById("MAIN_VIEW");
  const SettingView = document.getElementById("SETTING_VIEW");
  const Status = document.getElementById("STATUS");
  const TimerEL = document.getElementById("TIMER");

  if (SettingView.style.display === "none") {
    SettingView.style.display = "block";
    MainView.style.display = "none";
    Status.textContent = "Chuyển sang chế độ cấu hình...";
    TimerEL.textContent = "";
  } else {
    SettingView.style.display = "none";
    MainView.style.display = "block";
    WakeNAS(); // Gọi trực tiếp hàm WakeNAS để cập nhật giao diện
  }
}

function SaveSettings() {
  const Properties = PropertiesService.getScriptProperties();
  const oldPin = document.getElementById("CFG_OLD_PIN").value;
  const newPin = document.getElementById("CFG_NEW_PIN").value;
  const nasIp = document.getElementById("CFG_IP").value;
  const nasMac = document.getElementById("CFG_MAC").value;

  if (!oldPin || oldPin !== Properties.getProperty("WEB_PIN")) {
    return { STATUS: false, MESSAGE: "Mã PIN xác thực không chính xác!" };
  }

  if (nasIp) Properties.setProperty("NAS_IP", nasIp);
  if (nasMac) Properties.setProperty("NAS_MAC", nasMac);
  if (newPin) Properties.setProperty("WEB_PIN", newPin);

  return { STATUS: true, MESSAGE: "Đã cập nhật cấu hình thành công!" };
}
</script>
